<!-- LOADING SCREEN -->
<div class="boot-screen" [class.boot-hidden]="!isLoading">

  <div class="boot-scanlines"></div>
  <div class="boot-vignette"></div>

  <!-- Logo / title -->
  <div class="boot-header">
    <img src="ronquillo_logo_white_ver.png" alt="logo" class="boot-logo" />
    <div class="boot-title">
      <span class="boot-title-main">MICHAEL</span>
      <span class="boot-title-sub">RONQUILLO</span>
    </div>
    <div class="boot-subtitle">PORTFOLIO OS v1.0</div>
  </div>

  <!-- Terminal log lines -->
  <div class="boot-log">
    <div class="boot-log-line" *ngFor="let line of loadingLines">
      <span class="boot-log-bracket">{{ line }}</span>
    </div>
    <div class="boot-cursor">_</div>
  </div>

  <!-- Progress bar -->
  <div class="boot-progress-area">
    <div class="boot-status-text">{{ loadingStatusText }}</div>
    <div class="boot-bar-track">
      <div class="boot-bar-fill" [style.width.%]="loadingProgress"></div>
      <div class="boot-bar-glow" [style.left.%]="loadingProgress"></div>
    </div>
    <div class="boot-pct">{{ loadingProgress }}%</div>
  </div>

</div>

<!-- MAIN HOME PAGE -->
<div class="slider-page"
     [class.page-visible]="!isLoading"
     [style.backgroundImage]="'url(' + cards[activeIndex].bg + ')'">

  <div class="overlay"></div>

  <!-- Top bar -->
  <header class="top-bar">
    <a routerLink="/" class="logo">
      <img src="ronquillo_logo_white_ver.png" alt="logo">
      Michael <span>Ronquillo</span>
    </a>
    <nav class="top-links">
      <!-- Mute button -->
      <button class="mute-btn" (click)="toggleMute()" [title]="isMuted ? 'Unmute BGM' : 'Mute BGM'">
        <i class="fa-solid" [class.fa-volume-high]="!isMuted" [class.fa-volume-xmark]="isMuted"></i>
      </button>
      <a routerLink="/contact" (click)="playClickSound()" class="top-cta">
        <i class="fa-solid fa-envelope"></i> Contact Me
      </a>
    </nav>
  </header>

  <!-- Main content -->
  <main class="hero-content" [class.hero-split]="activeIndex === 0">

    <div class="hero-text">
      <p class="section-label">PORTFOLIO</p>
      <h1 class="hero-title">{{ cards[activeIndex].title }}</h1>
      <p class="hero-desc">{{ cards[activeIndex].desc }}</p>

      <div class="hero-actions" *ngIf="activeIndex === 0">
        <a href="Ronquillo_MichaelArnold_Resume.pdf" class="btn-primary" download target="_blank" (click)="playClickSound()">
          Download Resume <i class="fa-solid fa-download"></i>
        </a>
        <a routerLink="/contact" class="btn-secondary" (click)="playClickSound()">Hire Me</a>
      </div>

      <div class="social-links" *ngIf="activeIndex === 0">
        <a href="https://github.com/Mayk29" target="_blank"><i class="fa-brands fa-github"></i></a>
        <a href="mailto:ronquillomichaelarnold@gmail.com" target="_blank"><i class="fa-solid fa-envelope"></i></a>
        <a href="https://www.facebook.com/michael.ronquillo.9279" target="_blank"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://www.linkedin.com/in/michael-ronquillo-3701b92b1/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
      </div>

      <a *ngIf="activeIndex !== 0 && cards[activeIndex].link" [href]="cards[activeIndex].link"
         [target]="cards[activeIndex].external ? '_blank' : '_self'"
         class="btn-primary" style="margin-top: 1.5rem; display: inline-block;" (click)="playClickSound()">
        Visit Page <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

    <div class="hero-photo" *ngIf="activeIndex === 0">
      <div class="hero-photo-ring">
        <img src="Ronquillo_pic.png" alt="Michael Ronquillo" />
      </div>
    </div>

  </main>

  <!-- Bottom card strip -->
  <div class="card-strip">
    <ng-container *ngIf="!isMobile">
      <div *ngFor="let card of cards; let i = index"
           class="nav-card" [class.active]="i === activeIndex"
           (click)="setActive(i)" (mouseenter)="playHoverSound()"
           [style.backgroundImage]="'url(' + card.bg + ')'">
        <div class="card-overlay"></div>
        <div class="card-icon"><i [class]="card.icon"></i></div>
        <span class="card-label">{{ card.label }}</span>
      </div>
    </ng-container>

    <ng-container *ngIf="isMobile">
      <div class="card-strip-track">
        <div *ngFor="let card of visibleCards; let i = index"
             class="nav-card" [class.active]="card.originalIndex === activeIndex"
             (click)="setActive(card.originalIndex); playClickSound()"
             [style.backgroundImage]="'url(' + card.bg + ')'">
          <div class="card-overlay"></div>
          <div class="card-icon"><i [class]="card.icon"></i></div>
          <span class="card-label">{{ card.label }}</span>
        </div>
      </div>
      <div class="carousel-dots">
        <div *ngFor="let card of cards; let i = index"
             class="carousel-dot" [class.active]="i === activeIndex"
             (click)="setActive(i)"></div>
      </div>
      <div class="carousel-arrows">
        <button class="carousel-arrow" (click)="carouselPrev()">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="carousel-arrow" (click)="carouselNext()">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </ng-container>
  </div>

</div>
